[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anvesh", email = "19anveshh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
